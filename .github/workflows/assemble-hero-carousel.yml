name: Assemble hero carousel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/assemble-hero-carousel.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild final MP4 from verified sources
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hero-parts public/media

          curl -fsSL --retry 3 --retry-delay 2 \
            https://www.mybabyshire.com/media/hero-carousel.mp4 \
            -o /tmp/current-hero.mp4

          current_bytes=$(wc -c < /tmp/current-hero.mp4 | tr -d ' ')
          test "$current_bytes" -ge 12000
          head -c 12000 /tmp/current-hero.mp4 > /tmp/hero-prefix.bin
          prefix_sha=$(sha256sum /tmp/hero-prefix.bin | awk '{print $1}')
          echo "PREFIX_BYTES=12000 PREFIX_SHA256=$prefix_sha"
          test "$prefix_sha" = "8a821c0c5655bd4de80ce782c20a0a5dc00cf0f15d751a2a07c6b4140f2667c0"

          cp /tmp/hero-prefix.bin public/media/hero-carousel.mp4

          shas=(
            fdd0ffcc7321530ef13389ebeb103a86be7f5e44
            deca23ae08c82f8891f45ee46639de1b2f77b5ed
            ce719ff58e35d62a790e75d0c81574c855dec8a5
            acc2d0671b3597b9eed908c3eb3aff5219cf2a01
            d72a0ab4d3ea04a9058ea863b424ed78cd2b2bed
            98cbf0a4ba6796d9084f9acbb0d7cb4e91e5fcce
            33b5e4194d98f622fe957c1fa9d5d07834ea3a9d
            932a8acbbda636f69ee61477f83ae316b1713695
            d3eafc40a23a4743a20b0d624b8e2e115b8cb61a
            fb1f5c13407bc13f59e0ee818499265d66437ee6
            d4a4a78e0a9c0cc669a469848d7b977bb1262d79
            64f9ee9cc7236a3650416cf04f444b60b193f7d2
            791b4cd07bcdc9acc5dcbb81ae51cdd547625432
            da8f337cc29102a819d2370b659be240759a0a13
            c6d011e8ab9d068f792d6dbb07ec9da80b9709a6
            d797cfe08e1c46887295e38021e9073b31fd8fb8
            effec554c2af7cc3d5660396e39ac6f8c435a8d3
            b953535582a4f1124e97a301cda4553191c04cb8
            9ddf97af926a60b9e8b5d48ed4a3b47e8055851e
            4cb9cc61f4025d498ac75a51260dd6eff038bcff
            2eb52654f216d133f6f47136e9a9508060d20b68
          )

          for i in "${!shas[@]}"; do
            text_part="/tmp/hero-parts/part-$(printf '%02d' "$((i + 2))").b64"
            gh api "repos/$REPO/git/blobs/${shas[$i]}" --jq .content \
              | tr -d '\n' \
              | base64 -d > "$text_part"
            echo "SOURCE_OK index=$((i + 2)) bytes=$(wc -c < "$text_part")"
            base64 -d "$text_part" >> public/media/hero-carousel.mp4
          done

          bytes=$(wc -c < public/media/hero-carousel.mp4 | tr -d ' ')
          hash=$(sha256sum public/media/hero-carousel.mp4 | awk '{print $1}')
          echo "VIDEO_BYTES=$bytes VIDEO_SHA256=$hash"
          test "$bytes" = "136428"
          test "$hash" = "405b3e397f9ba1fe12fd3437b508db864de525ea8d632d535b8eb92259d9b538"

      - name: Commit complete video to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/hero-carousel.mp4
          if git diff --cached --quiet; then
            echo "Hero carousel already complete."
            exit 0
          fi
          git commit -m "Store complete hero carousel video"
          git push origin HEAD:main
